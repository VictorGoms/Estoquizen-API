<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="supported-color-schemes" content="dark">
  <title>Confirme que é você</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
</head>
<body style="margin:0;padding:0;background:#0b1220">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:#0b1220">Seu código para confirmar a alteração na conta do Estoquizen.</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0b1220;padding:32px 12px">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px">
        <tr><td style="padding:0 8px 20px">
          <table role="presentation" cellpadding="0" cellspacing="0"><tr>
            <td><img src="https://www.estoquizen.com.br/logo.png" width="36" height="36" alt="" style="display:block;border:0;border-radius:10px"></td>
            <td style="padding-left:10px;color:#f4f7fc;font-size:19px;font-weight:900;font-family:Nunito,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Estoquizen</td>
          </tr></table>
        </td></tr>
        <tr><td style="background:#151f33;border-radius:28px;padding:32px 28px">
              <h1 style="margin:0 0 12px;color:#f4f7fc;font-size:24px;font-weight:900;line-height:1.25;font-family:Nunito,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Confirme que é você</h1>
              <div style="color:#a9b5c9;font-size:15px;line-height:1.65;font-weight:600;font-family:Nunito,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Use este código para confirmar a alteração na sua conta:<div style="margin:20px 0 4px;padding:18px 0;background:#1d2840;border-radius:20px;text-align:center;color:#f4f7fc;font-size:32px;font-weight:900;letter-spacing:8px;font-family:Nunito,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">{{ .Token }}</div></div>
        </td></tr>
        <tr><td style="padding:20px 16px 0;color:#8592a8;font-size:12px;line-height:1.6;font-weight:600;text-align:center;font-family:Nunito,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
          Se você não pediu nenhuma alteração, ignore este e-mail e troque sua senha.<br>
          <span style="color:#a9b5c9">Estoquizen</span> · estoque simples para pequenos negócios
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
